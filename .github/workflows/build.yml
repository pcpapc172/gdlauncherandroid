name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false

      - name: Build debug APK
        run: bash gradlew assembleDebug lintDebug --no-daemon

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p app
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > app/keystore.jks

          if [ ! -s app/keystore.jks ]; then
            echo "Decoded keystore is empty or missing."
            exit 1
          fi

          echo "Keystore decoded successfully."

      - name: Verify release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_STORE_PASSWORD}" ]; then
            echo "KEYSTORE_STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_KEY_ALIAS}" ]; then
            echo "KEYSTORE_KEY_ALIAS secret is missing."
            exit 1
          fi

          keytool -list \
            -keystore app/keystore.jks \
            -storepass "${KEYSTORE_STORE_PASSWORD}" \
            -alias "${KEYSTORE_KEY_ALIAS}" >/dev/null

          echo "Keystore password and alias verified."

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        run: bash gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GDLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GDLauncher-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remove keystore
        if: always() && github.event_name != 'pull_request'
        run: rm -f app/keystore.jks

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0
          log-accepted-android-sdk-licenses: false

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: GDLauncher-release-signed
          path: release-apk

      - name: Verify and prepare release assets
        env:
          SIGNER_SHA256: cf4e84df333067da85625fb17bcd9c862dd1d6725a921254e5ebe1deb61e88d2
        run: |
          set -euo pipefail
          apk=release-apk/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          signer=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$signer" = "$SIGNER_SHA256"
          "$tools/aapt2" dump badging "$apk" > release-apk/badging.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re

          root = pathlib.Path("release-apk")
          apk = root / "app-release.apk"
          package = (root / "badging.txt").read_text().splitlines()[0]
          match = re.match(r"package: name='ir\.pcpapc172\.gdlauncher1' versionCode='(\d+)' versionName='([^']+)'", package)
          assert match, "Unexpected Android package metadata"
          code, version = int(match[1]), match[2]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", "Tag must match the APK version"
          repo = os.environ["GITHUB_REPOSITORY"]
          name = f"GDLauncher-{tag}.apk"
          apk = apk.rename(pathlib.Path(name))
          with apk.open("rb") as source:
              digest = hashlib.file_digest(source, "sha256").hexdigest()
          manifest = {
              "version_code": code,
              "version_name": version,
              "download_url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              "sha256": digest,
          }
          pathlib.Path("latestandroidlauncher.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GD Instance Launcher ${{ github.ref_name }}"
          body: |
            The launcher checks for updates when opened, prompts before downloading, and shows live progress while downloading the launcher APK.
          files: |
            GDLauncher-${{ github.ref_name }}.apk
            latestandroidlauncher.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
