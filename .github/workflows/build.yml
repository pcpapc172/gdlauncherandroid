name: Build and validate Android
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Fetch pinned upstream Geode regression fixture
        run: |
          curl --fail --location --silent --show-error --retry 3 'https://github.com/geode-sdk/android-launcher/releases/download/1.8.0/geode-launcher-v1.8.0.apk' -o "$RUNNER_TEMP/geode-fixture.apk"
          printf '%s  %s\n' 'fd5775cac2152dd782c142f0f0b42b7fe8259e1285a7bafe6ee8dc24eac1eab5' "$RUNNER_TEMP/geode-fixture.apk" | sha256sum --check
      - name: Validate, test, and build
        env:
          GD_GEODE_FIXTURE: ${{ runner.temp }}/geode-fixture.apk
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GDLauncher-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          retention-days: 30
      - name: Check tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          source=pathlib.Path('app/build.gradle.kts').read_text()
          version=re.search(r'versionName\s*=\s*"([^"]+)"',source).group(1)
          assert os.environ['RELEASE_TAG']=='v'+version, 'Tag must match app versionName'
          PY
      - name: Build signed release when configured
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/launcher-release.jks
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$RELEASE_TAG" = true ]; then
              echo 'Tagged releases require signing secrets.'
              exit 1
            fi
            echo 'Release signing not configured; debug APK is available.'
            exit 0
          fi
          test -n "$KEYSTORE_STORE_PASSWORD"
          test -n "$KEYSTORE_KEY_ALIAS"
          test -n "$KEYSTORE_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          bash gradlew assembleRelease --no-daemon
      - name: Upload signed release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GDLauncher-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GDLauncher-release
          path: release-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*.apk
          generate_release_notes: true
